
<!DOCTYPE html>
<html>
    <head>
        <title>My Hobbies</title>
        <style> 
            body{
                background-color: blue;
                margin: 30px 40px;
                border: 10px solid goldenrod;
                padding: 25px;
                align-items: center;
                justify-content: space-around;
            }
            .container{
                background-color: blue;
                font-family: fantasy;
                color: brown;
            }
            .activity-card{
                border: 10px solid gold;
                padding: 20px;
                background-color: azure;
                margin: 10px;
            }
            h1{
                color: blue;
                font-family: monospace;
                text-shadow: 10px 10px goldenrod;
                text-align: center;
            }
        </style>
        <link rel="stylesheet"
        href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    </head>
    <body>
        <h1>School Club</h1>
        <div class="container">
            <div class="row">
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="activity-card">
                        <h3>Reading</h3>
                        <p>We READ!</p>
                    </div>
                </div>
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="activity-card">
                        <h3>Playing</h3>
                        <p>We PLAY!</p>
                    </div>
                </div>
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="activity-card">
                        <h3>LEARNING</h3>
                        <p>WE LEARN!</p>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
