<!DOCTYPE html>
<html>
    <head>
        <title>My Science Lab</title>
    </head>
    <link rel="stylesheet"
    href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <body>
        <div class="jumbotron jumbotron-fluid">
            <div class="container">
                <h1>My Science Lab</h1>
                <p class="lead">This science lab is a lab in which developements are made!</p>
            </div>
        </div>
        <div class="container-btn">
            <button class="btn btn-primary">Chemistry</button>
            <button class="btn btn-warning">Genetic Engineering</button>
            <button class="btn btn-success">Astronomy</button>
            <button class="btn btn-danger">Geology</button>
        </div>
        <div class="container-badges">
            <h2>Experiments Completed</h2>
            <p>Chemistry <span class="badge badge-primary">8 experiments</span></p>
            <p>Genetic Engineering <span class="badge badge-warning">6 experiments</span></p>
            <p>Astronomy <span class="badge badge-dark">9 experiments</span></p>
            <p>Geology <span class="badge badge-info">10 experiments</span></p>
        </div>
        <h2 class="section-title">Research Progress</h2>
    <p>Chemistry</p>
    <div class="progress mb-3">
      <div class="progress-bar bg-primary" style="width: 85%">85%</div>
    </div>
    <p>Genetic Engineering</p>
    <div class="progress mb-3">
      <div class="progress-bar bg-success" style="width: 70%">70%</div>
    </div>
    <p>Astronomy</p>
    <div class="progress mb-3">
      <div class="progress-bar bg-warning" style="width: 55%">55%</div>
    </div>
    <p>Geology</p>
    <div class="progress mb-3">
      <div class="progress-bar bg-danger" style="width: 40%">40%</div>
    </div>

  </div>
</body>
</html>
