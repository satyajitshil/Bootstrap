<!DOCTYPE html>
<html>
    <head>
        <title>My Study Progress</title>
    </head>
    <link rel="stylesheet"
    href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <body>
        <div class="jumbotron jumbotron-fluid">
            <div class="container">
                <h1>My Study Prgress</h1>
                <p class="lead">Progress REPORT!</p>
            </div>
        </div>
        <div class="container-btn">
            <button class="btn btn-primary">English</button>
            <button class="btn btn-warning">Math</button>
            <button class="btn btn-success">Science</button>
            <button class="btn btn-danger">History</button>
        </div>
        <div class="container-badges">
            <h2>Experiments Completed</h2>
            <p>Math <span class="badge badge-primary">No Problem</span></p>
            <p>English <span class="badge badge-warning">Need to improve on inderstanding concepts</span></p>
            <p>Science <span class="badge badge-dark">No Problem</span></p>
            <p>History <span class="badge badge-info">Excellent!</span></p>
        </div>
        <h2 class="section-title">Research Progress</h2>
    <p>English</p>
    <div class="progress mb-3">
      <div class="progress-bar bg-primary" style="width: 85%">85%</div>
    </div>
    <p>Math</p>
    <div class="progress mb-3">
      <div class="progress-bar bg-success" style="width: 90%">95%</div>
    </div>
    <p>Science</p>
    <div class="progress mb-3">
      <div class="progress-bar bg-warning" style="width: 95%">95%</div>
    </div>
    <p>History</p>
    <div class="progress mb-3">
      <div class="progress-bar bg-danger" style="width: 99%">99%</div>
    </div>

  </div>
</body>
</html>
