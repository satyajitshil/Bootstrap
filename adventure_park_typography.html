<!DOCTYPE html>
<html>
    <head>
        <title>Typography with FOODS</title>
    <link rel="stylesheet"
    href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body{
            background-color: linen;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }
        hr{border-color: chocolate;}
        h2{
            color: chocolate; margin-top: 25px;
        }
        blockquote{
            border-left: 5px solid chocolate;

        }
        blockquote{
            color:dimgrey;
            font-style: italic;
        }
    </style>
    </head>
    <body>
        <p class="display-1">Adventure Park</p>
        <p class="display-2">Top Rides</p>
        <p class="display-3">Fun Facts</p>
        <p class="display-4">Crazy Trial!</p>

        <hr>
        <h2>Did you know?</h2>
        <p>Adventure Park is <mark>the most valued park</mark> worldwide.</p>
        <p>Children all around the world come to it!</p>
        
        <hr>
        <h2>Crazy Trial</h2>
        <p>My favorite ride is <abbr title="Crazy Trial">CT</abbr></p>

        <hr>
        <blockquote>
            <p>Adventure Park was AMAZING!</p>
            <p>-Johny</p>
        </blockquote>
        <hr>
    </body>
</html>
